<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark background rounded square -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>

  <!-- Box body - front face -->
  <polygon points="12,28 32,20 52,28 52,48 32,56 12,48" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Box top face -->
  <polygon points="12,28 32,20 52,28 32,36" fill="#2563eb" opacity="0.9"/>

  <!-- Box left face -->
  <polygon points="12,28 32,36 32,56 12,48" fill="#1d4ed8"/>

  <!-- Box right face -->
  <polygon points="52,28 32,36 32,56 52,48" fill="#1e40af"/>

  <!-- Blue tape stripe across top face -->
  <polygon points="22,24 42,24 46,27 26,27" fill="#60a5fa" opacity="0.85"/>

  <!-- Checkmark circle (white fill, blue stroke) -->
  <circle cx="46" cy="46" r="11" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="46" cy="46" r="9" fill="#2563eb"/>

  <!-- Checkmark tick -->
  <polyline points="41,46 44.5,49.5 51,42" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>