name: Backend checks

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: stocksense
          POSTGRES_PASSWORD: ephemeral-ci-password
          POSTGRES_DB: stocksense_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stocksense -d stocksense_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://stocksense:ephemeral-ci-password@localhost:5432/stocksense_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock
      - run: ruff check app tests migrations
      - run: ruff format --check app tests migrations
      - run: pytest -q
